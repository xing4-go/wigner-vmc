[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wigner-vmc"
version = "0.1.0"
description = "Variational Monte Carlo for the Wigner crystal / Hall liquid on a triangular torus"
readme = "USER_GUIDE.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m behavior` is the physics firewall; its layers are registered in
# tests/conftest.py, which owns the classification, so nothing is duplicated here.
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:wigner_vmc.*"]
